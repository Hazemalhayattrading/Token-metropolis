# Token Metropolis — published figures, one entry per figure.
# Human-curated; validated by scripts/build-data.ts. How to add a figure: UPDATING.md.
#
# component:   the curve this figure anchors (omit for context-only figures — shown, not used in curves)
# sourceKind:  primary = the company (or a primary source) published it, even if we link to press coverage;
#              third-party = an estimate by an analytics firm, analyst or journalist
# qualifier:   exact (±3%) · about (±10%) · over ("more than X": X is central and low, +15% high) · under · range
# verified:    page = read on the source page · snippet = seen in a search-result summary of the source
# Dates:       month-only figures use the 15th, "end of month" the last day, quarter-only the quarter's last day,
#              unless a note says otherwise.

